name: Build macOS Portable Package

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos-portable:
    name: Package macOS Portable
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create macOS Portable Package
        run: |
          chmod +x scripts/build_portable_macos.sh
          ./scripts/build_portable_macos.sh "7.0.16" "out/Release/DeGram.app" "."

      - name: Upload macOS Portable Package (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: DeGram-Portable-7.0.16-macOS.zip
          path: DeGram-Portable-7.0.16-macOS.zip

      - name: Upload macOS Portable Checksum (.sha256)
        uses: actions/upload-artifact@v4
        with:
          name: DeGram-Portable-7.0.16-macOS.zip.sha256
          path: DeGram-Portable-7.0.16-macOS.zip.sha256
