name: Build Windows Portable Package

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-portable:
    name: Package Windows x64 Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create Windows Portable Package
        shell: pwsh
        run: |
          ./scripts/build_portable_windows.ps1 -Version "7.0.16" -OutputDir "."

      - name: Upload Windows Portable Package (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: DeGram-Portable-7.0.16-Windows-x64.zip
          path: DeGram-Portable-7.0.16-Windows-x64.zip

      - name: Upload Windows Portable Checksum (.sha256)
        uses: actions/upload-artifact@v4
        with:
          name: DeGram-Portable-7.0.16-Windows-x64.zip.sha256
          path: DeGram-Portable-7.0.16-Windows-x64.zip.sha256
