name: Create Portable Cross-Platform Release

# This workflow only PACKAGES binaries; it does not compile DeGram.
# Each job fails until a real build step producing out/Release/DeGram
# (DeGram.exe / DeGram.app) is added before packaging.
# See docs/CI.md before enabling tag-triggered releases again.

on:
  workflow_dispatch:

jobs:
  build-linux-portable:
    name: Build Linux Portable (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Build Linux Portable Package
        run: |
          ./scripts/build_portable.sh "" "${{ matrix.arch }}" "out/Release/DeGram" "."

      - name: Upload Linux Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-${{ matrix.arch }}
          path: |
            DeGram-Portable-*.tar.xz
            DeGram-Portable-*.tar.xz.sha256

  build-windows-portable:
    name: Build Windows Portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create Windows Portable Package
        shell: pwsh
        run: |
          ./scripts/build_portable_windows.ps1 -OutputDir "."

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            DeGram-Portable-*.zip
            DeGram-Portable-*.zip.sha256

  build-macos-portable:
    name: Build macOS Portable
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create macOS Portable Package
        run: |
          ./scripts/build_portable_macos.sh "" "out/Release/DeGram.app" "."

      - name: Upload macOS Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable
          path: |
            DeGram-Portable-*.zip
            DeGram-Portable-*.zip.sha256

  publish-release:
    name: Publish Cross-Platform Release
    needs: [build-linux-portable, build-windows-portable, build-macos-portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(awk '/^AppVersionStr /{print $2}' Telegram/build/version)" >> "$GITHUB_OUTPUT"

      - name: Download all portable artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute combined SHA256SUMS
        run: |
          cd artifacts
          ls -la
          sha256sum DeGram-Portable-*.tar.xz DeGram-Portable-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DeGram Desktop Portable v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/DeGram-Portable-*.tar.xz
            artifacts/DeGram-Portable-*.tar.xz.sha256
            artifacts/DeGram-Portable-*.zip
            artifacts/DeGram-Portable-*.zip.sha256
            artifacts/SHA256SUMS.txt
