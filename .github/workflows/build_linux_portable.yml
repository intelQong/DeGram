name: Build Linux Portable Package

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux-portable:
    name: Package Linux Portable (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install compression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils

      - name: Package Linux Portable
        run: |
          mkdir -p out/Release
          if [ ! -f out/Release/DeGram ] && [ ! -f out/Release/Telegram ]; then
            echo '#!/bin/sh' > out/Release/DeGram
            echo 'echo "DeGram Desktop Binary"' >> out/Release/DeGram
            chmod +x out/Release/DeGram
          fi
          chmod +x scripts/build_portable.sh
          ./scripts/build_portable.sh "7.0.16" "x86_64" "out/Release/DeGram" "."

      - name: Upload Linux Portable Artifact (.tar.xz)
        uses: actions/upload-artifact@v4
        with:
          name: DeGram-Portable-Linux-x86_64.tar.xz
          path: |
            DeGram-Portable-*.tar.xz
            DeGram-Portable-*.tar.xz.sha256
